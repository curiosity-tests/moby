name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  # Cancel stale PR runs without interrupting push, tag, scheduled, or
  # manually dispatched validation.
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches:
    - 'master'
    - '[0-9]+.[0-9]+'
    - '[0-9]+.x'
  pull_request:

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  GO_VERSION: "1.26.8"
  GIT_PAGER: "cat"
  PAGER: "cat"
  SETUP_BUILDX_VERSION: edge
  SETUP_BUILDKIT_IMAGE: moby/buildkit:latest

run-name: "test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  validate-dco:
    permissions:
      pull-requests: read
      contents: read
      id-token: write
    uses: ./.github/workflows/.dco.yml

  build-dev:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 120 # guardrails timeout for the whole job
    needs:
    - validate-dco
    strategy:
      fail-fast: false
      matrix:
        arch:
        - amd64
        - arm64
        mode:
        - ""
        - systemd
        - firewalld
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Prepare
      env:
        MODE: ${{ matrix.mode }}
      run: |
        if [ "$MODE" = "systemd" ]; then
          echo "SYSTEMD=true" >> $GITHUB_ENV
        fi
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e   # v4.3.0
      with:
        version: ${{ env.SETUP_BUILDX_VERSION }}
        driver-opts: image=${{ env.SETUP_BUILDKIT_IMAGE }}
        buildkitd-flags: --debug
    - name: Build dev image
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b   # v7.3.0
      with:
        targets: dev
        set: |
          *.cache-from=type=gha,scope=${{ matrix.mode == '' && format('dev-{0}', matrix.arch) || format('dev-{0}-{1}', matrix.mode, matrix.arch) }}
          *.cache-to=type=gha,scope=${{ matrix.mode == '' && format('dev-{0}', matrix.arch) || format('dev-{0}-{1}', matrix.mode, matrix.arch) }}
          ${{ matrix.mode == '' && format('*.output=type=docker,dest=/tmp/dev-image-{0}.tar', matrix.arch) || '*.output=type=cacheonly' }}
    - name: Cache dev image
      if: matrix.mode == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      with:
        key: dev-image-${{ matrix.arch }}-${{ github.run_id }}
        path: /tmp/dev-image-${{ matrix.arch }}.tar

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  test:
    name: test (${{ matrix.arch }}, ${{ matrix.storage }})
    if: ${{ 'push' != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci/validate-only') }}
    needs:
    - build-dev
    - validate-dco
    uses: ./.github/workflows/.test.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only amd64 gets the full matrix
        - arch: amd64
          storage: snapshotter
          runnerSuffix: ""
          extraModes: '["rootless", "systemd", "rootless-systemd", "iptables+firewalld", "nftables", "nftables+firewalld", "embedded"]'
        - arch: amd64
          storage: graphdriver
          runnerSuffix: ""
          extraModes: '["rootless", "systemd", "userns"]'
        - arch: arm64
          storage: snapshotter
          runnerSuffix: "-arm"
          extraModes: '[]'
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      arch: ${{ matrix.arch }}
      storage: ${{ matrix.storage }}
      runnerSuffix: ${{ matrix.runnerSuffix }}
      extraModes: ${{ matrix.extraModes }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-unit:
    if: ${{ 'push' != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci/validate-only') }}
    needs:
    - build-dev
    - validate-dco
    uses: ./.github/workflows/.test-unit.yml
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runnerSuffix: ""
        - arch: arm64
          runnerSuffix: "-arm"
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      arch: ${{ matrix.arch }}
      runnerSuffix: ${{ matrix.runnerSuffix }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  validate-prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 10 # guardrails timeout for the whole job
    needs:
    - validate-dco
    outputs:
      matrix: ${{ steps.scripts.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - name: Create matrix
      id: scripts
      run: |
        # Select all validate scripts, excluding checks that are already run
        # elsewhere and/or require pull-request metadata (dco, pr-gh-references).
        scripts=$(cd ./hack/validate && jq -nc '$ARGS.positional - ["all", "default", "dco", "pr-gh-references"] | map(select(test("[.]")|not)) + ["generate-files"]' --args *)
        echo "matrix=$scripts" >> $GITHUB_OUTPUT
        echo "$scripts"

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30 # guardrails timeout for the whole job
    needs:
    - validate-prepare
    - build-dev
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJson(needs.validate-prepare.outputs.matrix) }}
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up runner
      uses: ./.github/actions/setup-runner
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e   # v4.3.0
      with:
        version: ${{ env.SETUP_BUILDX_VERSION }}
        driver: docker
        buildkitd-flags: --debug
    - name: Restore dev image
      id: restore-dev-image
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      with:
        key: dev-image-amd64-${{ github.run_id }}
        path: /tmp/dev-image-amd64.tar
    - name: Load dev image
      if: steps.restore-dev-image.outputs.cache-hit == 'true'
      run: |
        docker load -i /tmp/dev-image-amd64.tar
        # Fall back to building the dev image if the cache could not be
        # restored (e.g. cache miss or a rate-limited download).
    - name: Build dev image
      if: steps.restore-dev-image.outputs.cache-hit != 'true'
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b   # v7.3.0
      with:
        targets: dev
        set: |
          dev.cache-from=type=gha,scope=dev-amd64
    - name: Validate
      env:
        SCRIPT: ${{ matrix.script }}
      run: |
        make -o build "validate-${SCRIPT}"

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
