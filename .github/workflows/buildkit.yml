name: buildkit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs without interrupting push, tag, scheduled, or
  # manually dispatched validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
    - 'master'
    - '[0-9]+.[0-9]+'
    - '[0-9]+.x'
  pull_request:

env:
  GO_VERSION: "1.26.8"
  DESTDIR: ./build
  SETUP_BUILDX_VERSION: edge
  SETUP_BUILDKIT_IMAGE: moby/buildkit:latest

jobs:
  validate-dco:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/.dco.yml

  build-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 60 # guardrails timeout for the whole job
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci/validate-only') }}
    needs:
    - validate-dco
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e   # v4.3.0
      with:
        version: ${{ env.SETUP_BUILDX_VERSION }}
        driver-opts: image=${{ env.SETUP_BUILDKIT_IMAGE }}
        buildkitd-flags: --debug
    - name: Build
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b   # v7.3.0
      with:
        targets: binary
    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: binary
        path: ${{ env.DESTDIR }}
        if-no-files-found: error
        retention-days: 1

  test-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 60 # guardrails timeout for the whole job
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci/validate-only') }}
    needs:
    - build-linux
    env:
      TEST_IMAGE_BUILD: "0"
      TEST_IMAGE_ID: "buildkit-tests"
    strategy:
      fail-fast: false
      matrix:
        worker:
        - dockerd
        - dockerd-containerd
        pkg:
        - client
        - cmd/buildctl
        - solver
        - frontend
        - frontend/dockerfile
        typ:
        - integration
    steps:
    - name: Prepare
      run: |
        disabledFeatures="cache_backend_azblob,cache_backend_s3"
        if [ "${{ matrix.worker }}" = "dockerd" ]; then
          disabledFeatures="${disabledFeatures},merge_diff"
        fi
        echo "BUILDKIT_TEST_DISABLE_FEATURES=${disabledFeatures}" >> $GITHUB_ENV
      # Expose `ACTIONS_RUNTIME_TOKEN` and `ACTIONS_CACHE_URL`, which is used
      # in BuildKit's test suite to skip/unskip cache exporters:
      # https://github.com/moby/buildkit/blob/567a99433ca23402d5e9b9f9124005d2e59b8861/client/client_test.go#L5407-L5411
    - name: Expose GitHub Runtime
      uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487   # v4.0.0
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        path: moby
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false
    - name: BuildKit ref
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ./hack/buildkit-ref >> "$GITHUB_ENV"
      working-directory: moby
    - name: Checkout BuildKit ${{ env.BUILDKIT_REF }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        repository: ${{ env.BUILDKIT_REPO }}
        ref: ${{ env.BUILDKIT_REF }}
        path: buildkit
    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a   # v4.3.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e   # v4.3.0
      with:
        version: ${{ env.SETUP_BUILDX_VERSION }}
        driver-opts: image=${{ env.SETUP_BUILDKIT_IMAGE }}
        buildkitd-flags: --debug
    - name: Download binary artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
        name: binary
        path: ./buildkit/build/moby/
    - name: Update daemon.json
      run: |
        sudo rm -f /etc/docker/daemon.json
        sudo service docker restart
        docker version
        docker info
    - name: Build test image
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b   # v7.3.0
      env:
        GO_VERSION: ${{ env.GO_VERSION }}
      with:
        source: ./buildkit
        targets: integration-tests
        set: |
          *.output=type=docker,name=${{ env.TEST_IMAGE_ID }}
    - name: Test
      run: |
        ./hack/test ${{ matrix.typ }}
      env:
        CONTEXT: "."
        TEST_DOCKERD: "1"
        TEST_DOCKERD_BINARY: "./build/moby/dockerd"
        TESTPKGS: "./${{ matrix.pkg }}"
        TESTFLAGS: "-v --parallel=1 --timeout=30m --run=//worker=${{ matrix.worker }}$"
      working-directory: buildkit

